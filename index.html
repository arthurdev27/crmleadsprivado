<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LeadForge RJ</title>
<style>*{box-sizing:border-box}body{margin:0;background:#080a0e;color:#f5f7fb;font-family:Inter,system-ui,Arial}.wrap{max-width:1250px;margin:auto;padding:28px}.card{background:#11151c;border:1px solid #252c38;border-radius:18px;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.brand{font-size:27px;font-weight:850}.brand span{color:#61e6b7}.muted{color:#929aaa}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.metric b{display:block;font-size:30px;margin-top:5px}.controls{display:grid;grid-template-columns:1fr 1.2fr 90px 110px 110px;gap:10px}input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #2c3442;background:#0a0d12;color:#fff}button{padding:12px 15px;border:0;border-radius:10px;background:#61e6b7;color:#05100c;font-weight:750;cursor:pointer}.secondary{background:#222935;color:#fff}.table{overflow:auto;margin-top:16px}.row{display:grid;grid-template-columns:2fr 1fr .6fr 1fr 1.5fr;gap:12px;align-items:center;padding:14px 8px;border-bottom:1px solid #222833;min-width:850px}.head{font-size:12px;color:#8992a5;text-transform:uppercase}.pill{padding:5px 8px;border-radius:999px;background:#222935;font-size:12px}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{padding:8px 10px;font-size:12px}.login{max-width:420px;margin:15vh auto}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.controls{grid-template-columns:1fr 1fr}.wrap{padding:14px}}</style></head><body>
<div id="login" class="login card"><h1>⚡ LeadForge <span>RJ</span></h1><p class="muted">CRM privado de prospecção</p><input id="password" type="password" placeholder="Senha"><br><br><button onclick="doLogin()">Entrar</button><p id="error" class="muted"></p></div>
<div id="app" class="wrap" style="display:none"><div class="top"><div><div class="brand">⚡ LeadForge <span>RJ</span></div><div class="muted">Prospecção de pequenos negócios sem site</div></div><button class="secondary" onclick="logout()">Sair</button></div>
<div class="grid"><div class="card metric"><span class="muted">Leads</span><b id="m1">0</b></div><div class="card metric"><span class="muted">Sem site</span><b id="m2">0</b></div><div class="card metric"><span class="muted">Telefone</span><b id="m3">0</b></div><div class="card metric"><span class="muted">Score médio</span><b id="m4">0</b></div></div>
<div class="card"><h2>🔎 Buscar leads</h2><div class="controls"><select id="category"><option>hamburgueria</option><option>pizzaria</option><option>restaurante</option><option>lanchonete</option><option>pastelaria</option><option>açaí</option><option>salão de beleza</option><option>barbearia</option><option>cabeleireiro</option><option>estética</option></select><select id="city"></select><input id="amount" type="number" value="20" min="1" max="50"><button onclick="search()">Buscar</button><button class="secondary" onclick="load()">Meus leads</button></div><p class="muted">Fonte gratuita: OpenStreetMap/Overpass. A busca prioriza empresas com telefone e sem site.</p></div>
<br><div class="card"><h2>📋 Leads</h2><div id="table" class="table"></div></div></div>
<script>
const cities=["Rio de Janeiro","Niterói","São Gonçalo","Duque de Caxias","Nova Iguaçu","Belford Roxo","São João de Meriti","Petrópolis","Volta Redonda","Macaé","Rio das Ostras","Cabo Frio","Araruama","Saquarema","Maricá","Búzios","Angra dos Reis","Resende","Barra Mansa","Itaboraí","Campos dos Goytacazes"];city.innerHTML=cities.map(x=>`<option>${x}</option>`).join("");city.value="Rio das Ostras";let leads=[];
async function api(u,o={}){let r=await fetch(u,{credentials:"include",...o});if(r.status===401){login.style.display="block";app.style.display="none";throw Error("Não autenticado")}if(!r.ok)throw Error(await r.text());return r.json()}
async function boot(){try{let x=await api("/api/me");if(x.authenticated){login.style.display="none";app.style.display="block";load()}}catch(e){}}
async function doLogin(){try{await api("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:password.value})});location.reload()}catch(e){error.textContent="Senha inválida"}}
async function logout(){await api("/api/logout",{method:"POST"});location.reload()}
async function load(){leads=await api("/api/leads");render()}
async function search(){try{let x=await api(`/api/leads/search?category=${encodeURIComponent(category.value)}&city=${encodeURIComponent(city.value)}&amount=${amount.value}`);let ids=new Set(x.map(a=>a.id));leads=[...x,...leads.filter(a=>!ids.has(a.id))];render()}catch(e){alert(e.message)}}
function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function render(){m1.textContent=leads.length;m2.textContent=leads.filter(x=>!x.website).length;m3.textContent=leads.filter(x=>x.phone).length;m4.textContent=leads.length?Math.round(leads.reduce((a,x)=>a+(x.score||0),0)/leads.length):0;table.innerHTML='<div class="row head"><div>Lead</div><div>Categoria</div><div>Score</div><div>Telefone</div><div>Ações</div></div>'+leads.map(x=>`<div class="row"><div><b>${esc(x.name)}</b><div class="muted">${esc(x.address||x.city||"RJ")}</div></div><div><span class="pill">${esc(x.category)}</span></div><div><b>${x.score||0}</b></div><div>${esc(x.phone||"—")}</div><div class="actions">${x.phone?`<button onclick="wa('${esc(x.phone)}')">WhatsApp</button>`:""}${x.maps_url?`<button class="secondary" onclick="open('${x.maps_url}')">Maps</button>`:""}<button class="secondary" onclick="edit('${x.id}')">Editar</button></div></div>`).join("")||'<div class="muted" style="padding:35px;text-align:center">Nenhum lead ainda. Faça uma busca.</div>'}
function wa(p){let n=p.replace(/\D/g,"");if(n.length<=11)n="55"+n;window.open("https://wa.me/"+n,"_blank")}
async function edit(id){let x=leads.find(a=>a.id===id),status=prompt("Status",x.status||"Novo");if(status===null)return;let notes=prompt("Observações",x.notes||"");await api("/api/leads/"+encodeURIComponent(id),{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status,notes})});x.status=status;x.notes=notes;render()}boot();
</script></body></html>
